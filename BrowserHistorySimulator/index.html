<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Browser History Simulator</title>
    <meta name="description" content="Interactive browser history simulator with visit, back, forward, search and persistent storage. Built with modern UI design and vanilla JavaScript.">
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
</head>
<body>
    <main class="container">
        <section class="header">
            <h1>Browser History Simulator</h1>
        </section>
        <section class="controls card">
            <div class="input-group">
                <input id="urlInput" type="text" placeholder="Enter URL" />
                <button id="visitBtn" class="btn primary">Visit</button>
            </div>
            <div class="btn-group">
                <button id="backBtn" class="btn secondary">← Back</button>
                <button id="forwardBtn" class="btn secondary">Forward →</button>
                <button id="currentBtn" class="btn secondary">Current Page</button>
                <button id="clearBtn" class="btn danger">Clear History</button>
                <button id="saveBtn" class="btn secondary">Save</button>
                <button id="loadBtn" class="btn secondary">Load</button>
            </div>
        </section>
        <section class="search card">
            <input id="searchInput" type="text" placeholder="Search URL" />
            <button id="searchBtn" class="btn primary">Search</button>
        </section>
        <section class="output card">
            <div id="message" class="message"></div>
            <div id="history" class="history"></div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
